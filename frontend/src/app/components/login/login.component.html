<div class="login-wrapper">
  <!-- Fondo oscuro con overlay -->
  <div class="background-overlay"></div>

  <!-- Logo en esquina superior izquierda -->
  <div class="top-logo">
    <img src="POLICALUM.png" alt="POLICALUM" class="logo-img" />
  </div>

  <!-- Tarjeta centrada -->
  <div class="login-card">
    <!-- Título principal con el nombre de la empresa -->
    <h1 class="brand-title">POLICALUM</h1>
    <h2 class="card-title">Iniciar Sesión</h2>

    <form (ngSubmit)="onSubmit()" class="login-form">
      <!-- Email -->
      <div class="input-group">
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          required
          placeholder="Email"
          [disabled]="isLoading"
          autocomplete="email"
        />
      </div>

      <!-- Contraseña -->
      <div class="input-group password-group">
        <input
          [type]="showPassword ? 'text' : 'password'"
          id="password"
          [(ngModel)]="password"
          name="password"
          required
          placeholder="Contraseña"
          [disabled]="isLoading"
          autocomplete="current-password"
        />
        <button type="button" class="toggle-password" (click)="togglePassword()" tabindex="-1">
          <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
        </button>
      </div>

      <div *ngIf="notice" class="error-message">{{ notice }}</div>
      <!-- Mensaje de error -->
      <div *ngIf="error" class="error-message">
        <i class="fas fa-exclamation-triangle"></i> {{ error }}
      </div>

      <!-- Botón -->
      <button type="submit" class="btn-login" [disabled]="isLoading">
        <span *ngIf="!isLoading">Iniciar Sesión</span>
        <span *ngIf="isLoading" class="spinner">
          <i class="fas fa-circle-notch fa-spin"></i> Procesando...
        </span>
      </button>

      <!-- Enlaces inferiores -->
      <div class="form-footer">
        <a class="forgot-link" routerLink="/recuperar-password">¿Olvidaste tu contraseña?</a>
        <label class="remember-me">
          <input type="checkbox" /> Recuérdame
        </label>
      </div>
    </form>

    <!-- Aviso de contacto -->
    <p class="support-text">
      ¿Problemas de acceso? <a href="mailto:soporte@policalum.com">Contacta a Soporte IT</a>
    </p>

    <!-- Pie pequeño opcional -->
    <p class="recaptcha-text">
      Este sitio está protegido por políticas de seguridad. <a href="#">Más información</a>.
    </p>
  </div>
</div>
