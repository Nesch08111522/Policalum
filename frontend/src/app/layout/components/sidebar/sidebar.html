<div class="sidebar-backdrop" *ngIf="layout.mobileOpen()" (click)="layout.closeMobile()"></div>
<aside class="app-sidebar" aria-label="Navegación principal">
  <div class="sidebar-brand">
    <span class="brand-mark">P</span>
    <span class="brand-name"><strong>POLICALUM</strong><br /><span class="text-xs">ERP</span></span>
  </div>
  <nav class="sidebar-scroll">
    <section *ngFor="let section of sections">
      <div class="nav-section">{{ section.label }}</div>
      <a
        *ngFor="let item of section.items"
        class="nav-link"
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.path === '/inicio' }"
        [title]="item.label"
        (click)="layout.closeMobile()">
        <app-icon [name]="item.icon"></app-icon>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    </section>
  </nav>
</aside>
