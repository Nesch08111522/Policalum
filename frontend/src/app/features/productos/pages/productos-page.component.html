<section class="module-page">
  <app-page-header title="Productos" subtitle="Catálogo físico y de servicio, con precios y fraccionamiento." actionLabel="Nuevo producto" (action)="abrirCrear()"></app-page-header>
  <app-filter-bar>
    <app-form-field label="Buscar" inputId="prod-buscar"><input id="prod-buscar" class="input" type="search" [value]="filtros.controls.searchTerm.value" (input)="onBuscar($event)" placeholder="Nombre o SKU" /></app-form-field>
    <app-form-field label="Categoría" inputId="prod-cat"><app-select inputId="prod-cat" [options]="categorias" placeholder="Todas" [formControl]="filtros.controls.categoriaId"></app-select></app-form-field>
    <app-form-field label="Tipo" inputId="prod-tipo"><select id="prod-tipo" class="select" [formControl]="filtros.controls.tipo"><option value="">Todos</option><option value="FISICO">Físico</option><option value="SERVICIO">Servicio</option></select></app-form-field>
    <app-form-field label="Activo" inputId="prod-activo"><select id="prod-activo" class="select" [formControl]="filtros.controls.activo"><option value="">Todos</option><option value="true">Sí</option><option value="false">No</option></select></app-form-field>
    <app-form-field label="Fraccionable" inputId="prod-frac"><select id="prod-frac" class="select" [formControl]="filtros.controls.esFraccionable"><option value="">Todos</option><option value="true">Sí</option><option value="false">No</option></select></app-form-field>
    <div class="filter-actions"><button type="button" class="btn btn-primary" (click)="filtrar()">Filtrar</button><button type="button" class="btn btn-ghost" (click)="limpiar()">Limpiar</button></div>
  </app-filter-bar>
  <app-data-table [columns]="columns" [rows]="state.rows" [loading]="state.loading" [error]="state.error" [status]="state.status" [page]="state.page" [size]="state.size" [totalElements]="state.totalElements" [totalPages]="state.totalPages" [sortField]="state.sort.split(',')[0]" [sortDirection]="state.sort.endsWith('desc') ? 'desc' : 'asc'" emptyTitle="No hay productos" emptyAction="Nuevo producto" (pageChange)="cambiarPagina($event)" (sizeChange)="cambiarTamano($event)" (sortChange)="ordenar($event)" (retry)="cargar()" (empty)="abrirCrear()">
    <ng-template #rowActions let-row>
      <button type="button" class="btn btn-ghost btn-sm" (click)="abrirEditar(row)">Editar</button>
      <button type="button" class="btn btn-danger btn-sm" (click)="pedirEliminar(row)">Eliminar</button>
    </ng-template>
  </app-data-table>
</section>
<app-modal [open]="modal" [title]="editando ? 'Editar producto' : 'Nuevo producto'" size="lg" (closed)="modal = false">
  <form class="form-grid" [formGroup]="form">
    <div *ngIf="errorFormulario" class="alert alert-error span-2">{{ errorFormulario }}</div>
    <app-form-field label="Nombre" inputId="prod-nombre" [required]="true" [error]="errorDe('nombre')"><input id="prod-nombre" class="input" formControlName="nombre" /></app-form-field>
    <app-form-field label="SKU" inputId="prod-sku"><input id="prod-sku" class="input" formControlName="codigoSku" /></app-form-field>
    <app-form-field label="Categoría" inputId="prod-categoria"><app-select inputId="prod-categoria" [options]="categorias" placeholder="Sin categoría" formControlName="categoriaId"></app-select></app-form-field>
    <app-form-field label="Proveedor" inputId="prod-prov"><app-select inputId="prod-prov" [options]="proveedores" placeholder="Sin proveedor" formControlName="proveedorId"></app-select></app-form-field>
    <app-form-field label="Tipo" inputId="prod-tipo-f" [required]="true"><select id="prod-tipo-f" class="select" formControlName="tipo"><option value="FISICO">Físico</option><option value="SERVICIO">Servicio</option></select></app-form-field>
    <app-form-field label="Unidad" inputId="prod-unidad"><input id="prod-unidad" class="input" formControlName="unidad" /></app-form-field>
    <app-form-field label="Precio de compra" inputId="prod-compra" [required]="true" [error]="errorDe('precioCompra')"><input id="prod-compra" class="input" type="number" min="0" step="0.01" formControlName="precioCompra" /></app-form-field>
    <app-form-field label="Precio de venta" inputId="prod-venta" [required]="true" [error]="errorDe('precioVentaBase')"><input id="prod-venta" class="input" type="number" min="0" step="0.01" formControlName="precioVentaBase" /></app-form-field>
    <app-form-field class="span-2" label="Descripción" inputId="prod-desc"><textarea id="prod-desc" class="textarea" formControlName="descripcion"></textarea></app-form-field>
    <app-form-field label="Activo" inputId="prod-act"><input id="prod-act" class="switch" type="checkbox" formControlName="activo" /></app-form-field>
    <app-form-field label="Fraccionable" inputId="prod-esfrac"><input id="prod-esfrac" class="switch" type="checkbox" formControlName="esFraccionable" /></app-form-field>
    <app-form-field label="Incluye IGV" inputId="prod-igv"><input id="prod-igv" class="switch" type="checkbox" formControlName="incluyeIgv" /></app-form-field>
  </form>
  <div modalFooter>
    <button type="button" class="btn btn-ghost" (click)="modal = false" [disabled]="guardando">Cancelar</button>
    <button type="button" class="btn btn-primary" (click)="guardar()" [disabled]="form.invalid || guardando">{{ guardando ? 'Guardando…' : 'Guardar' }}</button>
  </div>
</app-modal>
<app-confirm-dialog [open]="confirmar" title="Eliminar producto" [message]="'Se eliminará ' + (seleccionado?.nombre || 'este producto') + '.'" confirmLabel="Eliminar" [loading]="eliminando" (confirm)="eliminar()" (cancel)="confirmar = false"></app-confirm-dialog>
