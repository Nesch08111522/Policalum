<section class="module-page">
  <app-page-header title="Almacenes" subtitle="Depósitos por sede. El stock y el kardex dependen de esta lista." actionLabel="Nuevo almacén" (action)="abrirCrear()"></app-page-header>
  <app-filter-bar>
    <app-form-field label="Buscar" inputId="alm-buscar"><input id="alm-buscar" class="input" type="search" [value]="filtros.controls.searchTerm.value" (input)="onBuscar($event)" placeholder="Nombre" /></app-form-field>
    <app-form-field label="Sede" inputId="alm-sede-f"><app-select inputId="alm-sede-f" [options]="sedes" placeholder="Todas" [formControl]="filtros.controls.sedeId"></app-select></app-form-field>
    <app-form-field label="Estado" inputId="alm-activo"><select id="alm-activo" class="select" [formControl]="filtros.controls.activo"><option value="">Todos</option><option value="true">Activos</option><option value="false">Inactivos</option></select></app-form-field>
    <div class="filter-actions"><button type="button" class="btn btn-primary" (click)="filtrar()">Filtrar</button><button type="button" class="btn btn-ghost" (click)="limpiar()">Limpiar</button></div>
  </app-filter-bar>
  <app-data-table [columns]="columns" [rows]="state.rows" [loading]="state.loading" [error]="state.error" [status]="state.status" [page]="state.page" [size]="state.size" [totalElements]="state.totalElements" [totalPages]="state.totalPages" [sortField]="state.sort.split(',')[0]" [sortDirection]="state.sort.endsWith('desc') ? 'desc' : 'asc'" emptyTitle="No hay almacenes" emptyAction="Nuevo almacén" (pageChange)="cambiarPagina($event)" (sizeChange)="cambiarTamano($event)" (sortChange)="ordenar($event)" (retry)="cargar()" (empty)="abrirCrear()">
    <ng-template #rowActions let-row>
      <button type="button" class="btn btn-ghost btn-sm" (click)="abrirEditar(row)">Editar</button>
      <button type="button" class="btn btn-danger btn-sm" (click)="pedirEliminar(row)">Eliminar</button>
    </ng-template>
  </app-data-table>
</section>
<app-modal [open]="modal" [title]="editando ? 'Editar almacén' : 'Nuevo almacén'" (closed)="modal = false">
  <form class="form-grid" [formGroup]="form">
    <div *ngIf="errorFormulario" class="alert alert-error span-2">{{ errorFormulario }}</div>
    <app-form-field class="span-2" label="Nombre" inputId="alm-nombre" [required]="true" [error]="errorDe('nombre')"><input id="alm-nombre" class="input" formControlName="nombre" /></app-form-field>
    <app-form-field class="span-2" label="Sede" inputId="alm-sede" [required]="true" [error]="errorDe('sedeId')"><app-select inputId="alm-sede" [options]="sedes" placeholder="Selecciona una sede" formControlName="sedeId"></app-select></app-form-field>
    <app-form-field class="span-2" label="Descripción" inputId="alm-desc"><textarea id="alm-desc" class="textarea" formControlName="descripcion"></textarea></app-form-field>
    <app-form-field label="Activo" inputId="alm-act"><input id="alm-act" class="switch" type="checkbox" formControlName="activo" /></app-form-field>
  </form>
  <div modalFooter>
    <button type="button" class="btn btn-ghost" (click)="modal = false" [disabled]="guardando">Cancelar</button>
    <button type="button" class="btn btn-primary" (click)="guardar()" [disabled]="form.invalid || guardando">{{ guardando ? 'Guardando…' : 'Guardar' }}</button>
  </div>
</app-modal>
<app-confirm-dialog [open]="confirmar" title="Eliminar almacén" [message]="'Se eliminará ' + (seleccionado?.nombre || 'este almacén') + '.'" confirmLabel="Eliminar" [loading]="eliminando" (confirm)="eliminar()" (cancel)="confirmar = false"></app-confirm-dialog>
