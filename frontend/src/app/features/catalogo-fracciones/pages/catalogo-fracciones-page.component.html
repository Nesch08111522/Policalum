<section class="module-page">
  <app-page-header title="Fracciones" subtitle="Unidades de venta y el factor con el que descuentan del kardex." actionLabel="Nueva fracción" (action)="abrirCrear()"></app-page-header>
  <app-filter-bar>
    <app-form-field label="Buscar" inputId="frac-buscar"><input id="frac-buscar" class="input" [formControl]="filtros.controls.searchTerm" placeholder="Nombre de la fracción" /></app-form-field>
    <app-form-field label="Producto" inputId="frac-prod"><app-select inputId="frac-prod" [options]="productos" placeholder="Todos" [formControl]="filtros.controls.productoId"></app-select></app-form-field>
    <app-form-field label="Estado" inputId="frac-activo"><select id="frac-activo" class="select" [formControl]="filtros.controls.activo"><option value="">Todos</option><option value="true">Activos</option><option value="false">Inactivos</option></select></app-form-field>
    <div class="filter-actions"><button type="button" class="btn btn-primary" (click)="filtrar()">Filtrar</button><button type="button" class="btn btn-ghost" (click)="limpiar()">Limpiar</button></div>
  </app-filter-bar>
  <app-data-table [columns]="columns" [rows]="state.rows" [loading]="state.loading" [error]="state.error" [status]="state.status" [page]="state.page" [size]="state.size" [totalElements]="state.totalElements" [totalPages]="state.totalPages" emptyTitle="No hay fracciones" emptyAction="Nueva fracción" (pageChange)="cambiarPagina($event)" (sizeChange)="cambiarTamano($event)" (retry)="cargar()" (empty)="abrirCrear()">
    <ng-template #rowActions let-row>
      <button type="button" class="btn btn-ghost btn-sm" (click)="abrirEditar(row)">Editar</button>
      <button type="button" class="btn btn-danger btn-sm" (click)="pedirEliminar(row)">Eliminar</button>
    </ng-template>
  </app-data-table>
</section>
<app-modal [closable]="!guardando" [open]="modal" [title]="editando ? 'Editar fracción' : 'Nueva fracción'" (closed)="modal = false">
  <form class="form-grid" [formGroup]="form">
    <div *ngIf="errorFormulario" class="alert alert-error span-2">{{ errorFormulario }}</div>
    <app-form-field class="span-2" label="Producto" inputId="frac-producto" [required]="true" [error]="errorDe('productoId')"><app-select inputId="frac-producto" [options]="productos" placeholder="Selecciona un producto" formControlName="productoId" [clearable]="false"></app-select></app-form-field>
    <app-form-field label="Nombre" inputId="frac-nombre" [required]="true" [error]="errorDe('nombreFraccion')"><input id="frac-nombre" class="input" formControlName="nombreFraccion" maxlength="50" /></app-form-field>
    <app-form-field label="Factor de kardex" inputId="frac-factor" [required]="true" [error]="errorDe('factorDescuentoKardex')" hint="Cuánto descuenta del stock base. Debe ser mayor a 0."><input id="frac-factor" class="input" type="number" min="0.0001" step="0.0001" formControlName="factorDescuentoKardex" /></app-form-field>
    <app-form-field label="Precio de venta" inputId="frac-precio"><input id="frac-precio" class="input" type="number" min="0" step="0.01" formControlName="precioVenta" /></app-form-field>
    <app-form-field label="Activo" inputId="frac-act"><input id="frac-act" class="switch" type="checkbox" formControlName="activo" /></app-form-field>
  </form>
  <div modalFooter>
    <button type="button" class="btn btn-ghost" (click)="modal = false" [disabled]="guardando">Cancelar</button>
    <button type="button" class="btn btn-primary" (click)="guardar()" [disabled]="guardando">{{ guardando ? 'Guardando…' : 'Guardar' }}</button>
  </div>
</app-modal>
<app-confirm-dialog [open]="confirmar" title="Eliminar fracción" [message]="'Si ' + (seleccionado?.nombreFraccion || 'esta fracción') + ' no está en ventas ni compras, se elimina. Si tiene historial, queda inactiva.'" confirmLabel="Eliminar" [loading]="eliminando" (confirm)="eliminar()" (cancel)="confirmar = false"></app-confirm-dialog>
