<section class="module-page">
  <app-page-header title="Sedes" subtitle="Locales operativos. La búsqueda se aplica sobre el listado cargado." actionLabel="Nueva sede" (action)="abrirCrear()"></app-page-header>
  <app-filter-bar>
    <app-form-field label="Buscar" inputId="sede-buscar"><input id="sede-buscar" class="input" type="search" [formControl]="filtros.controls.texto" placeholder="Nombre, ciudad o dirección" /></app-form-field>
    <app-form-field label="Estado" inputId="sede-activa"><select id="sede-activa" class="select" [formControl]="filtros.controls.activa"><option value="">Todas</option><option value="true">Activas</option><option value="false">Inactivas</option></select></app-form-field>
    <div class="filter-actions"><button type="button" class="btn btn-primary" (click)="filtrar()">Filtrar</button><button type="button" class="btn btn-ghost" (click)="limpiar()">Limpiar</button></div>
  </app-filter-bar>
  <app-data-table [columns]="columns" [rows]="state.rows" [loading]="state.loading" [error]="state.error" [status]="state.status" [page]="state.page" [size]="state.size" [totalElements]="state.totalElements" [totalPages]="state.totalPages" emptyTitle="No hay sedes" emptyAction="Nueva sede" (pageChange)="cambiarPagina($event)" (sizeChange)="cambiarTamano($event)" (sortChange)="ordenar($event)" (retry)="cargar()" (empty)="abrirCrear()">
    <ng-template #rowActions let-row>
      <button type="button" class="btn btn-ghost btn-sm" (click)="abrirEditar(row)">Editar</button>
      <button type="button" class="btn btn-danger btn-sm" (click)="pedirEliminar(row)">Eliminar</button>
    </ng-template>
  </app-data-table>
</section>
<app-modal [closable]="!guardando" [open]="modal" [title]="editando ? 'Editar sede' : 'Nueva sede'" (closed)="modal = false">
  <form class="form-grid" [formGroup]="form">
    <div *ngIf="errorFormulario" class="alert alert-error span-2">{{ errorFormulario }}</div>
    <app-form-field class="span-2" label="Nombre" inputId="sede-nombre" [required]="true" [error]="errorDe('nombre')"><input id="sede-nombre" class="input" formControlName="nombre" /></app-form-field>
    <app-form-field label="País" inputId="sede-pais"><input id="sede-pais" class="input" formControlName="pais" /></app-form-field>
    <app-form-field label="Ciudad" inputId="sede-ciudad"><input id="sede-ciudad" class="input" formControlName="ciudad" /></app-form-field>
    <app-form-field class="span-2" label="Dirección" inputId="sede-dir"><input id="sede-dir" class="input" formControlName="direccion" /></app-form-field>
    <app-form-field label="Celular" inputId="sede-cel" [error]="errorDe('celularSede')"><input id="sede-cel" class="input" formControlName="celularSede" /></app-form-field>
    <app-form-field label="Moneda" inputId="sede-moneda"><input id="sede-moneda" class="input" formControlName="moneda" maxlength="10" /></app-form-field>
    <app-form-field label="Activa" inputId="sede-act"><input id="sede-act" class="switch" type="checkbox" formControlName="activa" /></app-form-field>
  </form>
  <div modalFooter>
    <button type="button" class="btn btn-ghost" (click)="modal = false" [disabled]="guardando">Cancelar</button>
    <button type="button" class="btn btn-primary" (click)="guardar()" [disabled]="guardando">{{ guardando ? 'Guardando…' : 'Guardar' }}</button>
  </div>
</app-modal>
<app-confirm-dialog [open]="confirmar" title="Eliminar sede" [message]="'Se eliminará ' + (seleccionado?.nombre || 'esta sede') + '.'" confirmLabel="Eliminar" [loading]="eliminando" (confirm)="eliminar()" (cancel)="confirmar = false"></app-confirm-dialog>
