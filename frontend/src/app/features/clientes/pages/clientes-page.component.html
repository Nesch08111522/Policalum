<section class="module-page">
  <app-page-header title="Clientes" subtitle="Maestro de clientes para ventas, cotizaciones y despachos." actionLabel="Nuevo cliente" (action)="abrirCrear()">
    <app-export-buttons modulo="clientes"></app-export-buttons>
  </app-page-header>
  <app-filter-bar>
    <app-form-field label="Buscar" inputId="cliente-buscar">
      <input id="cliente-buscar" class="input" type="search" [value]="filtros.controls.searchTerm.value" (input)="onBuscar($event)" placeholder="Nombre o documento" />
    </app-form-field>
    <app-form-field label="Tipo de documento" inputId="cliente-tipo">
      <select id="cliente-tipo" class="select" [formControl]="filtros.controls.tipoDocumento">
        <option value="">Todos</option>
        <option value="DNI">DNI</option>
        <option value="RUC">RUC</option>
        <option value="CE">CE</option>
        <option value="PASAPORTE">Pasaporte</option>
      </select>
    </app-form-field>
    <div class="filter-actions">
      <button type="button" class="btn btn-primary" (click)="filtrar()">Filtrar</button>
      <button type="button" class="btn btn-ghost" (click)="limpiar()">Limpiar</button>
    </div>
  </app-filter-bar>
  <app-data-table
    [columns]="columns"
    [rows]="state.rows"
    [loading]="state.loading"
    [error]="state.error"
    [status]="state.status"
    [page]="state.page"
    [size]="state.size"
    [totalElements]="state.totalElements"
    [totalPages]="state.totalPages"
    [sortField]="state.sort.split(',')[0]"
    [sortDirection]="state.sort.endsWith('desc') ? 'desc' : 'asc'"
    emptyTitle="No hay clientes"
    emptyMessage="Registra el primer cliente para usarlo en ventas y cotizaciones."
    emptyAction="Nuevo cliente"
    (pageChange)="cambiarPagina($event)"
    (sizeChange)="cambiarTamano($event)"
    (sortChange)="ordenar($event)"
    (retry)="cargar()"
    (empty)="abrirCrear()">
    <ng-template #rowActions let-row>
      <button type="button" class="btn btn-ghost btn-sm" (click)="abrirEditar(row)">Editar</button>
      <button type="button" class="btn btn-danger btn-sm" (click)="pedirEliminar(row)">Eliminar</button>
    </ng-template>
  </app-data-table>
</section>

<app-modal [closable]="!guardando" [open]="modal" [title]="editando ? 'Editar cliente' : 'Nuevo cliente'" (closed)="modal = false">
  <form class="form-grid" [formGroup]="form" (ngSubmit)="guardar()">
    <div *ngIf="errorFormulario" class="alert alert-error span-2">{{ errorFormulario }}</div>
    <app-form-field class="span-2" label="Nombre" inputId="cli-nombre" [required]="true" [error]="errorDe('nombre')">
      <input id="cli-nombre" class="input" formControlName="nombre" />
    </app-form-field>
    <app-form-field label="Tipo" inputId="cli-tipo" [required]="true" [error]="errorDe('tipoDocumento')">
      <select id="cli-tipo" class="select" formControlName="tipoDocumento">
        <option value="DNI">DNI</option>
        <option value="RUC">RUC</option>
        <option value="CE">Carné de extranjería</option>
        <option value="PASAPORTE">Pasaporte</option>
      </select>
    </app-form-field>
    <app-form-field label="Número" inputId="cli-doc" [required]="true" [error]="errorDe('numeroDocumento')" hint="DNI: 8 dígitos. RUC: 11 dígitos.">
      <input id="cli-doc" class="input" formControlName="numeroDocumento" />
    </app-form-field>
    <app-form-field label="Celular" inputId="cli-cel" [error]="errorDe('celular')">
      <input id="cli-cel" class="input" formControlName="celular" inputmode="numeric" />
    </app-form-field>
    <app-form-field label="Correo" inputId="cli-email" [error]="errorDe('email')">
      <input id="cli-email" class="input" type="email" formControlName="email" />
    </app-form-field>
    <app-form-field class="span-2" label="Dirección" inputId="cli-dir" [error]="errorDe('direccion')">
      <input id="cli-dir" class="input" formControlName="direccion" />
    </app-form-field>
  </form>
  <div modalFooter>
    <button type="button" class="btn btn-ghost" (click)="modal = false" [disabled]="guardando">Cancelar</button>
    <button type="button" class="btn btn-primary" (click)="guardar()" [disabled]="guardando">{{ guardando ? 'Guardando…' : 'Guardar' }}</button>
  </div>
</app-modal>

<app-confirm-dialog
  [open]="confirmar"
  title="Eliminar cliente"
  [message]="'Se eliminará a ' + (seleccionado?.nombre || 'este cliente') + '.'"
  confirmLabel="Eliminar"
  [loading]="eliminando"
  (confirm)="eliminar()"
  (cancel)="confirmar = false">
</app-confirm-dialog>
