<main class="error-page">
  <section class="error-card" role="alert">
    <img class="marca" [src]="marca.logoSrc()" [alt]="marca.nombre()" (error)="marca.usarRespaldo()" />
    <p class="kicker">{{ pagina.kicker }}</p>
    <p class="codigo">{{ pagina.codigo }}</p>
    <h1>{{ pagina.titulo }}</h1>
    <p class="detalle">{{ pagina.detalle }}</p>
    <div class="acciones">
      <a class="btn btn-primary" [routerLink]="destino">{{ etiquetaDestino }}</a>
      <button type="button" class="btn btn-ghost" (click)="reintentar()">Reintentar</button>
    </div>
  </section>
</main>
