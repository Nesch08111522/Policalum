<section class="module-page">
  <app-page-header title="Auditoría" subtitle="Eventos del sistema. La descarga del archivo de logs no está conectada: el cliente espera JSON."></app-page-header>
  <div class="stats-grid" *ngIf="dashboard">
    <app-stat-card label="Eventos" [value]="dashboard.totalEventos ?? 0" icon="search"></app-stat-card>
    <app-stat-card label="Del sistema" [value]="dashboard.eventosDelSistema ?? 0" icon="shield"></app-stat-card>
    <app-stat-card label="Sin fecha" [value]="dashboard.logsSinFecha ?? 0" icon="alert"></app-stat-card>
  </div>
  <article class="card card-body" *ngIf="puntos.length"><h2>Eventos por día</h2><app-bar-chart [points]="puntos" label="Eventos de auditoría por día"></app-bar-chart></article>
  <app-filter-bar>
    <app-form-field label="Tabla" inputId="aud-tabla"><input id="aud-tabla" class="input" [formControl]="filtros.controls.tabla" placeholder="ventas" /></app-form-field>
    <app-form-field label="Acción" inputId="aud-acc"><select id="aud-acc" class="select" [formControl]="filtros.controls.accion"><option value="">Todas</option><option>INSERT</option><option>UPDATE</option><option>DELETE</option><option>LOGIN</option><option>LOGOUT</option><option>ACCESS</option></select></app-form-field>
    <app-form-field label="Usuario" inputId="aud-user"><app-select inputId="aud-user" [options]="usuarios" placeholder="Todos" [formControl]="filtros.controls.userId"></app-select></app-form-field>
    <app-form-field label="Desde" inputId="aud-desde"><input id="aud-desde" class="input" type="date" [formControl]="filtros.controls.desde" /></app-form-field>
    <app-form-field label="Hasta" inputId="aud-hasta"><input id="aud-hasta" class="input" type="date" [formControl]="filtros.controls.hasta" /></app-form-field>
    <div class="filter-actions"><button type="button" class="btn btn-primary" (click)="filtrar()">Filtrar</button><button type="button" class="btn btn-ghost" (click)="limpiar()">Limpiar</button></div>
  </app-filter-bar>
  <app-data-table [columns]="columns" [rows]="state.rows" [loading]="state.loading" [error]="state.error" [status]="state.status" [page]="state.page" [size]="state.size" [totalElements]="state.totalElements" [totalPages]="state.totalPages" [sortField]="state.sort.split(',')[0]" [sortDirection]="state.sort.endsWith('desc') ? 'desc' : 'asc'" emptyTitle="Sin eventos" emptyMessage="No hay registros para los filtros elegidos." (pageChange)="cambiarPagina($event)" (sizeChange)="cambiarTamano($event)" (sortChange)="ordenar($event)" (retry)="cargar()">
    <ng-template #rowActions let-row><button type="button" class="btn btn-ghost btn-sm" (click)="ver(row)">Detalle</button></ng-template>
  </app-data-table>
</section>
<app-modal [open]="abierto" title="Detalle del evento" size="lg" (closed)="abierto = false">
  <p *ngIf="detalle">{{ detalle.accion }} en {{ detalle.tabla }} por {{ detalle.userNombre || detalle.userEmail || 'sistema' }}</p>
  <pre class="card card-body">{{ detalleJson }}</pre>
</app-modal>
