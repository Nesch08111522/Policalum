<section class="module-page">
  <app-page-header title="Portafolio web" subtitle="Estos proyectos aparecen en la galería del portal público."></app-page-header>
  <form class="form-grid" [formGroup]="form" *ngIf="esAdmin">
    <app-form-field label="Título" inputId="pf-titulo" [required]="true"><input id="pf-titulo" class="input" formControlName="titulo" /></app-form-field>
    <app-form-field label="Orden" inputId="pf-orden"><input id="pf-orden" class="input" type="number" formControlName="orden" /></app-form-field>
    <app-form-field label="Descripción" inputId="pf-desc" class="span-2"><textarea id="pf-desc" class="textarea" formControlName="descripcion"></textarea></app-form-field>
    <app-form-field label="Imagen (URL https)" inputId="pf-img" class="span-2"><input id="pf-img" class="input" formControlName="imagenUrl" placeholder="https://" /></app-form-field>
    <app-form-field label="Publicado" inputId="pf-pub"><input id="pf-pub" class="switch" type="checkbox" formControlName="publicado" /></app-form-field>
    <div class="filter-actions">
      <button type="button" class="btn btn-primary" (click)="guardar()" [disabled]="guardando">{{ editando ? 'Guardar cambios' : 'Agregar proyecto' }}</button>
      <button type="button" class="btn btn-ghost" *ngIf="editando" (click)="limpiar()">Cancelar</button>
    </div>
  </form>
  <table class="table" *ngIf="proyectos.length">
    <thead><tr><th>Orden</th><th>Proyecto</th><th>Estado</th><th *ngIf="esAdmin"></th></tr></thead>
    <tbody>
      <tr *ngFor="let proyecto of proyectos">
        <td>{{ proyecto.orden }}</td>
        <td><strong>{{ proyecto.titulo }}</strong><br><span class="text-muted">{{ proyecto.descripcion }}</span></td>
        <td><span class="badge" [class.badge-success]="proyecto.publicado" [class.badge-neutral]="!proyecto.publicado">{{ proyecto.publicado ? 'Publicado' : 'Oculto' }}</span></td>
        <td *ngIf="esAdmin">
          <button type="button" class="btn btn-ghost btn-sm" (click)="editar(proyecto)">Editar</button>
          <button type="button" class="btn btn-danger btn-sm" (click)="eliminar(proyecto)">Quitar</button>
        </td>
      </tr>
    </tbody>
  </table>
  <p *ngIf="!proyectos.length">Todavía no hay proyectos. Los que agregues se ven en el portal.</p>
</section>
