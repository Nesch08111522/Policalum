spring.application.name=erp

# =========================================================================
# DATABASE CONFIGURATION (POSTGRESQL)
# =========================================================================
spring.jpa.properties.hibernate.type.json_format_mapper=com.policalum.erp.infrastructure.config.HibernateJackson3FormatMapper
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ERPpoli}
spring.datasource.username=postgres
spring.datasource.password=postgre
spring.datasource.driver-class-name=org.postgresql.Driver
spring.cloud.config.enabled=false
server.address=0.0.0.0

# =========================================================================
# HIBERNATE / JPA CONFIGURATION
# =========================================================================
# 'update' creates tables if they don't exist and alters them if @Entity changes
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
# Shows SQL queries in the console (useful for debugging)
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.security.basic.enabled=false
# PostgreSQL specific dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Configuraci\u00F3n TOTP
# JWT Configuration
jwt.secret=MiClaveSecretaSuperSeguraParaJWT1234567890!@#$%^&*()
jwt.expiration=28800000
jwt.refresh-expiration=1209600000

# TOTP Configuration
totp.secret-key-publico=kR57n2vVeJkxZqtM310N-TOe5QvZbjAPwgDkWePlz0I


# =========================================================================
# UPLOADS (Archivos adjuntos)
# =========================================================================
policalum.uploads.base-path=./uploads
policalum.uploads.max-file-size-bytes=10485760
policalum.uploads.allowed-extensions=pdf,jpg,jpeg,png,webp
policalum.uploads.allowed-types=FACTURA,GUIA_REMISION,ORDEN_COMPRA,OTRO

# Multipart (Spring)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# =========================================================================
# OPENAPI / SWAGGER (springdoc)
# =========================================================================
# JSON: /v3/api-docs  |  UI: /swagger-ui.html
# En produccion se puede apagar con springdoc.api-docs.enabled=false y springdoc.swagger-ui.enabled=false
policalum.api.version=1.0.0
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.default-produces-media-type=application/json
# Pageable y demas objetos de query se muestran como parametros sueltos (page, size, sort)
springdoc.default-flat-param-object=true
springdoc.writer-with-order-by-keys=true
