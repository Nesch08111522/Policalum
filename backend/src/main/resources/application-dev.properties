# Perfil local: no usar en producción.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.password=${DB_PASSWORD:postgre}
jwt.secret=${JWT_SECRET:dev-only-change-this-jwt-secret-please-rotate}
totp.secret-key-publico=${TOTP_PUBLIC_SECRET:dev-only-totp-secret}
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
