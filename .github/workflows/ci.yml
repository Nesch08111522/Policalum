name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ERPpoli
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_local_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ERPpoli"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Pruebas del backend
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/ERPpoli
          DB_USERNAME: postgres
          DB_PASSWORD: postgres_local_dev
          JWT_SECRET: ci-only-jwt-secret-please-rotate-32bytes
          TOTP_PUBLIC_SECRET: ci-only-totp-secret
        run: chmod +x mvnw && ./mvnw clean test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            sitio_web/package-lock.json
      - name: Pruebas del ERP
        working-directory: frontend
        run: npm ci && npm run test -- --watch=false
      - name: Pruebas del sitio
        working-directory: sitio_web
        run: npm ci && npm run test -- --watch=false
